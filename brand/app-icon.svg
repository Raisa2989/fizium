<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c13a58"/>
      <stop offset="1" stop-color="#8f2036"/>
    </linearGradient>
  </defs>
  <!-- скруглённый квадрат -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- атом: три эллиптические орбиты -->
  <g transform="translate(256 256)" stroke="#ffffff" stroke-width="22" fill="none">
    <ellipse rx="176" ry="68"/>
    <ellipse rx="176" ry="68" transform="rotate(60)"/>
    <ellipse rx="176" ry="68" transform="rotate(120)"/>
  </g>
  <!-- ядро -->
  <circle cx="256" cy="256" r="44" fill="#ffffff"/>
  <!-- электроны -->
  <circle cx="256" cy="188" r="20" fill="#ffffff" opacity="0.65"/>
  <circle cx="317" cy="293" r="17" fill="#ffffff" opacity="0.5"/>
</svg>
